<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Recipe</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav><div class="container"><h1><a href="/">🍳 Recipe App</a></h1><ul><li><a href="/">Recipes</a></li><li><a href="/planner.html">Meal Planner</a></li><li><a href="/add.html" class="btn btn-primary">+ Add Recipe</a></li></ul></div></nav>
  <div class="container">
    <div class="form-page">
      <h2 id="form-title">Add Recipe</h2>
      <form id="recipe-form" enctype="multipart/form-data">
        <div class="form-group"><label for="title">Title</label><input type="text" name="title" id="title" required></div>
        <div class="form-group"><label for="description">Description</label><textarea name="description" id="description" rows="2"></textarea></div>
        <div class="form-group"><label for="category">Category</label>
          <select name="category" id="category"><option value="breakfast">Breakfast</option><option value="lunch">Lunch</option><option value="dinner" selected>Dinner</option><option value="dessert">Dessert</option><option value="snack">Snack</option></select>
        </div>
        <div class="form-group"><label for="ingredients">Ingredients (one per line)</label><textarea name="ingredients" id="ingredients" rows="6"></textarea></div>
        <div class="form-group"><label for="instructions">Instructions</label><textarea name="instructions" id="instructions" rows="6"></textarea></div>
        <div class="form-row">
          <div class="form-group"><label for="prep_time">Prep Time (min)</label><input type="number" name="prep_time" id="prep_time" min="0"></div>
          <div class="form-group"><label for="cook_time">Cook Time (min)</label><input type="number" name="cook_time" id="cook_time" min="0"></div>
          <div class="form-group"><label for="servings">Servings</label><input type="number" name="servings" id="servings" min="1"></div>
        </div>
        <div class="form-group"><label for="image">Image</label><input type="file" name="image" id="image" accept="image/*"></div>
        <button type="submit" class="btn btn-primary">Save Recipe</button>
      </form>
    </div>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
